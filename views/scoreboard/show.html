<div class="container mx-auto px-4 py-8">
    <h1 class="mb-6">Scoreboard</h1>

    <div >
        <table class="table table-hover">
            <thead>
                <tr>
                    <th scope="col" class="text-left">#</th>
                    <th scope="col" class="text-left">Bruger</th>
                    <th scope="col" class="text-left">Point</th>
                    <th scope="col" class="text-left">Achievements</th>
                </tr>
            </thead>
            <tbody>
                {{range $stat := .UserStats}}
                <tr data-href="/users/{{ $stat.User.ID }}/">
                    <td>{{ $stat.Rank }}</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <span class="avatar-ring me-2"><img src="{{userImage $stat.User}}" alt=""></span>
                            <a href="/users/{{ $stat.User.ID }}/"><span>{{$stat.User.Name}}</span></a>
                        </div>
                    </td>
                    <td>{{$stat.Points}}</td>
                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            {{range $stat.AchievementsSummary}}
                              <div class="flex-shrink-1">
                                <img width="48" src="/images/{{ .ImageSlug }}" title="{{.Name}} (Level {{.Level}})">
                              </div>
                            {{end}}
                        </div>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
