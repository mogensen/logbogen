    <script src="/js/theme-init.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <header>
      {{ template "layouts/navbar" . }}
    </header>

    <main role="main" class="container flex-grow-1">
      <div class="main-container">
      {{embed}}
      </div>
    </main><!-- /.container -->

    {{ template "layouts/footer" . }}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script src="/js/usermap.js"></script>
  <script src="/js/application.js"></script>
  <script src="/js/certifications.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/clickable-rows.js"></script>
  <script src="/js/field-limits.js"></script>
  <script src="/js/error-page.js"></script>
