{{ if .ActivityHeatmap }}
<div class="card-body pt-2">

  <div class="activity-heatmap-title">
    <span class="activity-heatmap-title-text">Aktiviteter</span>
    <span class="activity-heatmap-title-rule"></span>
  </div>

  <div class="activity-heatmap">
    <div class="activity-heatmap-header">
      <span></span>
      <span><span class="d-none d-md-inline">Jan</span><span class="d-md-none">J</span></span>
      <span><span class="d-none d-md-inline">Feb</span><span class="d-md-none">F</span></span>
      <span><span class="d-none d-md-inline">Mar</span><span class="d-md-none">M</span></span>
      <span><span class="d-none d-md-inline">Apr</span><span class="d-md-none">A</span></span>
      <span><span class="d-none d-md-inline">Maj</span><span class="d-md-none">M</span></span>
      <span><span class="d-none d-md-inline">Jun</span><span class="d-md-none">J</span></span>
      <span><span class="d-none d-md-inline">Jul</span><span class="d-md-none">J</span></span>
      <span><span class="d-none d-md-inline">Aug</span><span class="d-md-none">A</span></span>
      <span><span class="d-none d-md-inline">Sep</span><span class="d-md-none">S</span></span>
      <span><span class="d-none d-md-inline">Okt</span><span class="d-md-none">O</span></span>
      <span><span class="d-none d-md-inline">Nov</span><span class="d-md-none">N</span></span>
      <span><span class="d-none d-md-inline">Dec</span><span class="d-md-none">D</span></span>
    </div>
    {{ range $row := .ActivityHeatmap }}
    <div class="activity-heatmap-row">
      <span class="activity-heatmap-year">'{{ slice (printf "%d" $row.Year) 2 }}</span>
      {{ range $cell := $row.Months }}
      <div class="activity-heatmap-cell{{ if $cell.IsCurrentPeriod }} activity-heatmap-cell--current{{ end }}{{ if not $cell.Color }} intensity-0{{ end }}{{ if $cell.IsFuture }} activity-heatmap-cell--future{{ end }}"
        {{ if $cell.Color }}style="background:{{ $cell.Color }}"{{ end }}
        title="{{ $cell.Tooltip }}"></div>
      {{ end }}
    </div>
    {{ end }}
  </div>

  <div class="activity-heatmap-legend">
    {{ range $item := .HeatmapLegend }}
    <span class="activity-heatmap-legend-item">
      <span class="activity-heatmap-legend-swatch" style="background:{{ $item.Color }}"></span>
      {{ $item.Name }}
    </span>
    {{ end }}
  </div>

</div>
{{ end }}
