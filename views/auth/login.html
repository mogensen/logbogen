<div class="auth-center">
    <div class="login-form">
        <div class="login-card">
        <h2 class="text-center">Login</h2>

        {{ if .error }}
        <div class="alert alert-danger" role="alert">
            {{ .error }}
        </div>
        {{ end }}

        {{ if .DevMode }}
            <form method="POST" action="/auth/dev-login">
                <input type="hidden" name="_csrf" value="{{ .csrf }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Navn</label>
                    <input type="text" class="form-control" id="name" name="name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <button type="submit" class="btn btn-primary login-btn w-100">Log ind (dev)</button>
                <p class="text-muted mt-3 mb-0"><small>Dev login bypass — Firebase is disabled in this environment.</small></p>
            </form>
        {{ else }}
        <div id="firebase-login"
             data-api-key="{{ .Firebase.APIKey }}"
             data-auth-domain="{{ .Firebase.AuthDomain }}"
             data-project-id="{{ .Firebase.ProjectID }}"
             data-emulator-host="{{ .Firebase.EmulatorHost }}">
                <div id="login-message" class="alert d-none" role="alert" aria-live="polite"></div>

                <form id="email-form" novalidate>
                    <div id="name-group" class="mb-3 d-none">
                        <label for="login-name" class="form-label">Navn</label>
                        <input type="text" class="form-control" id="login-name" autocomplete="name" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label for="login-email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="login-email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="login-password" class="form-label">Adgangskode</label>
                            <a href="#" id="forgot-password" class="small">Glemt adgangskode?</a>
                        </div>
                        <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" id="email-submit" class="btn btn-primary login-btn w-100">Log ind</button>
                </form>

                <div id="resend-group" class="d-none mt-3 text-center">
                    <button type="button" id="resend-verification" class="btn btn-link p-0">Send bekræftelsesmailen igen</button>
                </div>

                <div class="login-divider"><span>Eller fortsæt med</span></div>

                <button type="button" id="google-login" class="btn btn-primary login-btn w-100">
                    <i class="fab fa-google me-2"></i>Log ind med Google
                </button>

                <p class="text-center text-muted mt-4 mb-0">
                    <span id="toggle-prompt">Har du ikke en logbog endnu?</span>
                    <a href="#" id="toggle-signup">Opret en!</a>
                </p>
        </div>
        <script type="module" src="/js/firebase-login.js"></script>
        {{ end }}
        </div>
    </div>
</div>
